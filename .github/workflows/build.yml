# Build Kiln on every push to main or dev and every pull request into main.
#
# The windows job tests, builds the one-folder zip and the portable exe, and
# uploads both together with Kiln-windows.json: the manifest the in-app update
# check reads to find, compare, and verify a newer build (see kiln/update.py).
#
# Pushes then publish those files to a rolling pre-release per branch, tagged
# latest-<branch>. Workflow artifacts cannot be downloaded without signing in to
# GitHub, even on a public repository; release assets can, at a fixed URL:
#
#   https://github.com/<owner>/<repo>/releases/download/latest-main/Kiln-windows.json
#
# Pull request builds are never published: nothing installed should update to
# one.

name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Build
        env:
          # The run number only ever increases, which is what lets an update
          # check order builds without parsing version strings.
          KILN_BUILD_NUMBER: ${{ github.run_number }}
          KILN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          KILN_CHANNEL: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
        run: python scripts/build_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: Kiln-windows-b${{ github.run_number }}
          path: |
            dist/Kiln-*.zip
            dist/Kiln-*.exe
            dist/Kiln-*.json
          if-no-files-found: error
          retention-days: 30

  publish:
    # A manual run from any other branch would otherwise publish a channel no
    # installed Kiln is on.
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'dev')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: latest-${{ github.ref_name }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kiln-windows-b${{ github.run_number }}
          path: dist

      # Replaced rather than edited: file names carry the build number, so
      # uploading over the old release would leave every past build's files
      # piling up on it. For the few seconds in between, an update check finds
      # nothing and says it could not check, which is harmless.
      - name: Replace the rolling release
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Kiln ${{ github.ref_name }} build ${{ github.run_number }}" \
            --notes "Latest build of \`${{ github.ref_name }}\`, from ${GITHUB_SHA::7}. Kiln updates itself from here: use Check for updates at the right end of the toolbar."
